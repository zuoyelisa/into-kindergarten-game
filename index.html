<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9be4f4">
<title>辰宝的一天 · Inton päivä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#214238; --cream:#fff8e8; --cream-sel:#fff5df; --white:#fff;
  --font:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  /* size tokens (phone first) */
  --hdr-h:64px; --av:44px; --lang-h:50px; --lang-av:34px;
  --nav:52px; --cap-h:60px; --cap-r:22px; --cap-font:17px;
  --gutter:12px;
}
@media (min-width:700px) and (min-height:560px){
  :root{ --hdr-h:96px; --av:64px; --lang-h:66px; --lang-av:46px; --nav:58px; --cap-h:80px; --cap-r:28px; --cap-font:22px; --gutter:28px; }
}
@media (min-width:1000px) and (min-height:700px){
  :root{ --hdr-h:118px; --av:76px; --lang-h:76px; --lang-av:53px; --cap-h:87px; --cap-r:30px; --cap-font:22.9px; --gutter:46px; }
}
/* short landscape phones */
@media (max-height:500px){
  :root{ --hdr-h:54px; --av:38px; --lang-h:44px; --lang-av:30px; --nav:46px; --cap-h:50px; --cap-r:18px; --cap-font:16px; --gutter:12px; }
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--cream);font-family:var(--font);color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;--accent:#ef6950;--sel:#ef6950}

/* ---------- header ---------- */
.hdr{flex:none;height:var(--hdr-h);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 max(var(--gutter), env(safe-area-inset-right,0px)) 0 max(var(--gutter), env(safe-area-inset-left,0px));
  background:rgba(255,248,232,.96);border-bottom:3px solid rgba(33,66,56,.12);position:relative;z-index:5}
.me{display:flex;align-items:center;gap:clamp(8px,1.4vw,14px);min-width:0}
.av{display:block;flex:none}
.app{--av1:#874328;--av2:#e86550}
.av svg{display:block;width:100%;height:100%;overflow:visible}
.me .av{width:var(--av);height:var(--av);border-radius:50%;box-shadow:0 4px 0 rgba(33,66,56,.16)}
.me div{min-width:0}
.me small{display:block;font-size:clamp(10px,1.1vw,12px);line-height:1.5;color:var(--title)}
.me b{display:block;font-weight:400;font-size:clamp(18px,2.4vw,27.4px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:clamp(6px,1vw,10px);flex:none}
.lang{height:var(--lang-h);border-radius:calc(var(--lang-h) * .29);background:var(--white);border:2px solid var(--ink);
  box-shadow:0 4px 0 rgba(33,66,56,.12);display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;
  transition:transform .15s, box-shadow .2s, background .2s, border-color .2s}
.lang .av{width:calc(var(--lang-av) * 1.094);height:calc(var(--lang-av) * 1.094)}
.lang span{text-align:left;line-height:1}
.lang b{display:block;font-weight:400;font-size:clamp(15px,1.6vw,18px);line-height:1.4}
.lang small{display:block;font-size:8.5px;line-height:1.5;opacity:.6;letter-spacing:.4px}
.lang .spk{width:22px;height:22px;color:var(--hdr-accent, var(--accent));flex:none;margin-left:6px}
.lang:not([aria-pressed="true"]){border-color:var(--av1)}
.lang[aria-pressed="true"].lang{border-color:var(--av1);box-shadow:0 4px 0 var(--av1)}
.lang[aria-pressed="true"].lang:active{box-shadow:0 1px 0 var(--av1)}
.lang[aria-pressed="true"]{background:var(--cream-sel);border-color:var(--sel);box-shadow:0 4px 0 var(--sel)}
.lang:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sel)}
.lang.hello .av{animation:helloAv .7s ease}
@keyframes helloAv{0%,100%{transform:none}30%{transform:rotate(-12deg) scale(1.12)}60%{transform:rotate(10deg) scale(1.1)}}
@media (max-width:699px), (max-height:500px){
  .lang small,.lang .spk{display:none}
  .lang{padding:0 12px 0 5px}
}
@media (max-width:360px){ .me div{display:none} }

/* ---------- scene view ---------- */
.view{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sky);transition:background .5s}
.scene{position:absolute;inset:0;transition:transform .6s cubic-bezier(.6,.05,.25,1),opacity .6s;will-change:transform}
.scene[data-pos="prev"]{transform:translateX(-105%);opacity:0;pointer-events:none}
.scene[data-pos="next"]{transform:translateX(105%);opacity:0;pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0}
.layer{position:absolute;left:0;top:0;width:1143px;height:642px;transform-origin:0 0}
.layer > svg{position:absolute;left:0;top:0;overflow:visible}
.scene [data-key]{cursor:pointer}
.hint{position:absolute;left:max(var(--gutter), env(safe-area-inset-left,0px));top:14px;display:flex;align-items:center;gap:8px;
  font-size:clamp(13px,1.4vw,16px);line-height:24px;color:rgba(33,66,56,.72);z-index:3;padding:6px 10px 6px 4px;border-radius:14px}
.hint svg{width:22px;height:22px}
@media (max-width:699px), (max-height:500px){ .hint{display:none} }

/* word chips live in scene coordinates, but keep a readable/tappable size via --ls */
.word{position:absolute;height:55px;min-width:95px;border-radius:26px;background:var(--cream);border:3px solid var(--ink);
  box-shadow:0 6px 0 rgba(33,66,56,.18);display:flex;align-items:center;gap:10px;padding:0 7px 0 17px;white-space:nowrap;
  font-size:18.3px;line-height:28px;z-index:2;transform:translate(-50%,-50%) scale(var(--ls,1));transform-origin:50% 50%}
.word .dot{width:35px;height:35px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.dot svg{width:21px;height:21px}
.speaking .dot::after,.speaking.capicon::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:3px solid var(--accent);animation:ring .8s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.word.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%,100%{transform:translate(-50%,-50%) scale(var(--ls,1))}40%{transform:translate(-50%,-50%) scale(calc(var(--ls,1) * 1.18))}}

/* ---------- word shelf (portrait phones) ---------- */
.shelf{display:none}
.app.portrait .layer .word{display:none}
.app.portrait .shelf{display:flex;flex:none;flex-wrap:wrap;justify-content:center;gap:10px 10px;padding:12px var(--gutter) 4px;background:var(--ground-c);transition:background .5s}
.shelf .word{position:static;transform:none;height:48px;min-width:0;font-size:16px;padding:0 6px 0 14px;gap:8px;border-radius:24px;box-shadow:0 4px 0 rgba(33,66,56,.18)}
.shelf .word .dot{width:32px;height:32px}
.shelf .word .dot svg{width:19px;height:19px}
.shelf .word.pop{animation:popS .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popS{40%{transform:scale(1.15)}}
.shelf .word:active{transform:translateY(2px)}
.app.boot .scene{transition:none}

/* ---------- bottom bar ---------- */
.bar{flex:none;position:relative;z-index:4;background:var(--ground-c);transition:background .5s;
  padding:8px max(var(--gutter), env(safe-area-inset-right,0px)) 10px max(var(--gutter), env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:var(--nav) 1fr var(--nav);grid-template-rows:auto auto;column-gap:clamp(10px,2vw,24px);row-gap:8px;align-items:center}
.cap{grid-column:2;justify-self:center;width:100%;max-width:620px;height:var(--cap-h);border-radius:var(--cap-r);background:var(--cream);border:4px solid var(--ink);
  box-shadow:0 6px 0 rgba(33,66,56,.24);display:flex;align-items:center;padding:0 0 0 calc(var(--cap-h) * .14)}
.cap:active{transform:translateY(3px)}
.capicon{width:calc(var(--cap-h) * .63);height:calc(var(--cap-h) * .63);border-radius:calc(var(--cap-h) * .22);background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.capicon svg{width:52%;height:52%}
.captxt{flex:1;padding-left:12px;min-width:0;text-align:left;height:100%;display:flex;flex-direction:column;justify-content:center}
.captxt small{display:block;font-size:10px;line-height:15px;color:var(--accent-deep)}
.captxt b{display:block;font-weight:400;font-size:var(--cap-font);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.capnext{width:48px;height:100%;font-size:34px;line-height:1;display:grid;place-items:center;flex:none}
.nav{width:var(--nav);height:var(--nav);border-radius:calc(var(--nav) * .34);background:var(--cream);border:4px solid var(--ink);
  box-shadow:0 5px 0 rgba(33,66,56,.22);font:700 calc(var(--nav) * .7)/1 Arial,sans-serif;display:grid;place-items:center;padding-bottom:4px;transition:transform .12s}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(33,66,56,.22)}
.nav.prev{grid-column:1;grid-row:1}.nav.next{grid-column:3;grid-row:1}
.nav[disabled]{opacity:.35;cursor:default}
.pager{grid-column:1 / -1;grid-row:2;justify-self:center;display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.dots{display:flex;gap:6px}
.dots button{width:28px;height:28px;display:grid;place-items:center}
.dots button::before{content:"";width:12px;height:12px;border-radius:10px;background:rgba(33,66,56,.28);transition:width .35s,background .35s}
.dots button[aria-current="true"]{width:44px}
.dots button[aria-current="true"]::before{width:36px;background:var(--accent)}
@media (max-height:500px){
  .bar{padding-top:6px;padding-bottom:6px;grid-template-columns:var(--nav) auto 1fr auto var(--nav);grid-template-rows:auto}
  .cap{grid-column:3}
  .pager{grid-column:2;grid-row:1}
  .pager span{display:none}
  .dots{flex-direction:column;gap:0}
  .dots button{width:22px;height:12px}
  .dots button[aria-current="true"]{width:22px}
  .dots button::before{width:8px;height:8px}
  .dots button[aria-current="true"]::before{width:16px}
  .nav.next{grid-column:5}
}

/* ---------- toast & sparkles ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 12px);transform:translateX(-50%) translateY(-16px);background:var(--ink);color:#fff;font-size:15px;line-height:22px;
  padding:10px 18px;border-radius:16px;opacity:0;transition:.3s;z-index:9;width:max-content;max-width:min(620px,90vw);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:8}
.spark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;animation:spark .7s ease-out forwards}
.spark.star{border-radius:0;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);width:22px;height:22px;margin:-11px 0 0 -11px}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1) rotate(160deg);opacity:0}}

@media (max-width:599px){
  :root{ --cap-font:clamp(14px,4.3vw,17px); --nav:clamp(44px,12vw,52px); }
  .capnext{display:none}
  .cap{padding-right:12px}
}
/* ---------- object animations ---------- */
.t{transform-box:fill-box;transform-origin:50% 50%}
.t[data-anim=swing],.t[data-anim=dig],.t[data-anim=raise],.t[data-anim=wave],.t[data-anim=kickL],.t[data-anim=kickR]{transform-origin:50% 6%}
.t[data-anim=tilt],.t[data-anim=stir],.t[data-anim=shake],.t[data-anim=wiggle],.t[data-anim=wiggleHop],.t[data-anim=lean],.t[data-anim=jump],.t[data-anim=hop],.t[data-anim=hopB],.t[data-anim=bounce],.t[data-anim=squish],.t[data-anim=squishS],.t[data-anim=jelly],.t[data-anim=tapA],.t[data-anim=tapB],.t[data-anim=rock]{transform-origin:50% 100%}
.t[data-anim=nod]{transform-origin:50% 90%}
.t[data-anim=flutter]{transform-origin:0% 50%}

.go[data-anim=glow]{animation:glow 1.8s ease-in-out}
@keyframes glow{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.18) rotate(12deg)}55%{transform:scale(1.08) rotate(-8deg)}80%{transform:scale(1.14) rotate(4deg)}100%{transform:none}}
.glowfx{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scale(.5);pointer-events:none}
.glowfx.go{animation:glowfx 1.8s ease-out}
@keyframes glowfx{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.05)}60%{opacity:.85;transform:scale(1.25)}100%{opacity:0;transform:scale(1.45)}}

.go[data-anim=swing]{animation:swing 1.5s ease-in-out}
@keyframes swing{0%{transform:rotate(0)}15%{transform:rotate(16deg)}35%{transform:rotate(-13deg)}55%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.go[data-anim=jump]{animation:jump 1.1s cubic-bezier(.3,.7,.4,1)}
@keyframes jump{0%{transform:none}10%{transform:scale(1.06,.92)}30%{transform:translateY(-46px) scale(.96,1.05)}48%{transform:translateY(0) scale(1.06,.93)}62%{transform:translateY(-26px)}80%{transform:translateY(0) scale(1.03,.97)}100%{transform:none}}
.go[data-anim=hop]{animation:hop .9s cubic-bezier(.3,.7,.4,1)}
.go[data-anim=hopB]{animation:hop .9s cubic-bezier(.3,.7,.4,1) .12s}
@keyframes hop{0%,100%{transform:none}15%{transform:scale(1.08,.9)}45%{transform:translateY(-38px) rotate(-6deg)}70%{transform:translateY(0) scale(1.06,.94)}85%{transform:translateY(-8px)}}
.go[data-anim=wiggle]{animation:wiggle .9s ease-in-out}
@keyframes wiggle{0%,100%{transform:none}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.go[data-anim=kickL]{animation:kick .9s ease-in-out}
.go[data-anim=kickR]{animation:kick .9s ease-in-out .2s}
@keyframes kick{0%,100%{transform:none}30%{transform:rotate(-28deg)}60%{transform:rotate(14deg)}}
.go[data-anim=raise]{animation:raise 1.5s cubic-bezier(.4,1.4,.5,1)}
@keyframes raise{0%{transform:none}25%{transform:rotate(calc(var(--r) * 135deg))}40%{transform:rotate(calc(var(--r) * 115deg))}55%{transform:rotate(calc(var(--r) * 140deg))}70%{transform:rotate(calc(var(--r) * 118deg))}85%{transform:rotate(calc(var(--r) * 135deg))}100%{transform:none}}
.go[data-anim=wave]{animation:wave 1.7s ease-in-out}
@keyframes wave{0%{transform:none}20%{transform:rotate(calc(var(--r) * 150deg))}35%{transform:rotate(calc(var(--r) * 120deg))}50%{transform:rotate(calc(var(--r) * 155deg))}65%{transform:rotate(calc(var(--r) * 120deg))}80%{transform:rotate(calc(var(--r) * 150deg))}100%{transform:none}}
.go[data-anim=tapA]{animation:tap .8s ease-in-out}
.go[data-anim=tapB]{animation:tap .8s ease-in-out .18s}
@keyframes tap{0%,100%{transform:none}30%{transform:translateY(-22px) rotate(-14deg)}55%{transform:translateY(0)}75%{transform:translateY(-8px) rotate(5deg)}}
.go[data-anim=squish]{animation:squish .8s cubic-bezier(.3,1.5,.5,1)}
.go[data-anim=squishS]{animation:squishS .8s ease-in-out}
@keyframes squish{0%,100%{transform:none}30%{transform:scale(1.12,.88)}60%{transform:scale(.94,1.08)}}
@keyframes squishS{0%,100%{transform:none}30%{transform:scale(1.02,.94)}60%{transform:scale(.99,1.03)}}
.go[data-anim=tilt]{animation:tilt 1.4s ease-in-out}
@keyframes tilt{0%,100%{transform:none}20%{transform:translateY(-20px) rotate(0)}50%{transform:translateY(-20px) rotate(-38deg)}75%{transform:translateY(-10px) rotate(-30deg)}}
.go[data-anim=jelly]{animation:jelly .9s ease}
@keyframes jelly{0%,100%{transform:none}20%{transform:scale(1.2,.8)}40%{transform:scale(.85,1.15) translateY(-14px)}60%{transform:scale(1.08,.92)}80%{transform:scale(.97,1.03)}}
.go[data-anim=bounce]{animation:bounce .9s ease}
@keyframes bounce{0%,100%{transform:none}35%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
.go[data-anim=nod]{animation:nod 1.1s ease-in-out}
@keyframes nod{0%,100%{transform:none}20%{transform:rotate(10deg)}45%{transform:rotate(-8deg)}70%{transform:rotate(7deg)}}
.go[data-anim=stir]{animation:stir 1.4s ease-in-out}
@keyframes stir{0%,100%{transform:none}20%{transform:rotate(-24deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-20deg)}80%{transform:rotate(10deg)}}
.go[data-anim=drift]{animation:drift 2.2s ease-in-out}
.go[data-anim=driftB]{animation:drift 2.2s ease-in-out reverse}
@keyframes drift{0%,100%{transform:none}35%{transform:translate(60px,-8px) scale(1.1)}70%{transform:translate(-20px,4px) scale(.95)}}
.go[data-anim=shake]{animation:shake .8s ease-in-out}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-14deg) translateY(-10px)}30%{transform:rotate(12deg) translateY(-12px)}45%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}}
.go[data-anim=dig]{animation:dig 1.2s ease-in-out}
@keyframes dig{0%,100%{transform:none}25%{transform:rotate(-22deg) translateY(10px)}50%{transform:rotate(18deg) translateY(-14px)}75%{transform:rotate(-12deg) translateY(6px)}}
.go[data-anim=rock]{animation:rock 1s ease-in-out}
@keyframes rock{0%,100%{transform:none}25%{transform:scale(1.02,.96)}50%{transform:scale(.99,1.02)}75%{transform:scale(1.01,.98)}}
.go[data-anim=flutter]{animation:flutter 1.3s ease-in-out}
@keyframes flutter{0%,100%{transform:none}25%{transform:skewY(-4deg) scale(1.04,1.06)}50%{transform:skewY(3deg)}75%{transform:skewY(-2deg) scale(1.02)}}
.go[data-anim=breathe]{animation:breathe 1.6s ease-in-out}
@keyframes breathe{0%,100%{transform:none}25%{transform:scale(1.06)}50%{transform:scale(.99)}75%{transform:scale(1.05)}}
.go[data-anim=wiggleHop]{animation:wiggleHop 1s ease}
@keyframes wiggleHop{0%,100%{transform:none}25%{transform:translateY(-30px) rotate(-12deg)}50%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-12px) rotate(-5deg)}}
.go[data-anim=lean]{animation:lean 1.7s ease-in-out}
@keyframes lean{0%,100%{transform:none}30%{transform:rotate(-5deg)}70%{transform:rotate(3deg)}}
.t[data-anim=sway],.t[data-anim=swayB],.t[data-anim=crawl],.t[data-anim=slug],.t[data-anim=scurry],.t[data-anim=spider]{transform-origin:50% 100%}
.go[data-anim=sway]{animation:sway 1.8s ease-in-out}
.go[data-anim=swayB]{animation:sway 1.8s ease-in-out .15s}
@keyframes sway{0%,100%{transform:none}20%{transform:rotate(-3deg)}45%{transform:rotate(2.5deg)}70%{transform:rotate(-1.5deg)}}
.go[data-anim=fly]{animation:fly 2s ease-in-out}
@keyframes fly{0%,100%{transform:none}20%{transform:translate(-30px,-34px) rotate(-10deg)}45%{transform:translate(-70px,-6px) rotate(6deg)}70%{transform:translate(-26px,-26px) rotate(-6deg)}}
.go[data-anim=fly] .wingL{animation:flap .25s ease-in-out 8;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{50%{transform:scaleY(-.6)}}
.go[data-anim=leafSpin]{animation:leafSpin 1.6s ease-in-out}
.go[data-anim=leafSpinB]{animation:leafSpin 1.6s ease-in-out .15s}
.go[data-anim=leafSpinC]{animation:leafSpin 1.6s ease-in-out .3s}
@keyframes leafSpin{0%,100%{transform:none}25%{transform:translate(8px,-46px) rotate(140deg)}55%{transform:translate(-10px,-22px) rotate(250deg)}80%{transform:translate(4px,-6px) rotate(340deg)}}
.go[data-anim=crawl]{animation:crawl 2.2s ease-in-out}
@keyframes crawl{0%,100%{transform:none}50%{transform:translateX(-34px) scaleX(1.06)}}
.go[data-anim=crawl] .shell{animation:shell .55s ease-in-out 4;transform-box:fill-box;transform-origin:50% 100%}
@keyframes shell{50%{transform:rotate(8deg)}}
.go[data-anim=slug]{animation:slug 2s ease-in-out}
.t[data-anim=inch]{transform-origin:100% 100%}
.go[data-anim=inch]{animation:inch 2.2s ease-in-out}
@keyframes inch{0%,100%{transform:none}20%{transform:scaleX(1.14) scaleY(.9)}40%{transform:translateX(-12px) scaleX(.94) scaleY(1.05)}60%{transform:translateX(-18px) scaleX(1.12) scaleY(.92)}80%{transform:translateX(-24px)}}
@keyframes slug{0%,100%{transform:none}20%{transform:scaleX(1.18) scaleY(.88)}40%{transform:translateX(16px) scaleX(.92) scaleY(1.06)}60%{transform:translateX(24px) scaleX(1.15) scaleY(.9)}80%{transform:translateX(30px)}}
.go[data-anim=spider]{animation:still 1.6s}
@keyframes still{to{transform:none}}
.leg{transform-box:fill-box}
.legL{transform-origin:100% 50%}.legR{transform-origin:0% 50%}
.go[data-anim=spider] .legL{animation:legL .32s ease-in-out 5}
.go[data-anim=spider] .legR{animation:legR .32s ease-in-out 5}
.go[data-anim=spider] .l1,.go[data-anim=spider] .l3{animation-delay:.16s}
@keyframes legL{0%,100%{transform:none}50%{transform:rotate(16deg)}}
@keyframes legR{0%,100%{transform:none}50%{transform:rotate(-16deg)}}
.go[data-anim=scurry] .leg{animation:legs .18s linear 8}
@keyframes legs{50%{transform:translateY(-2px)}}
.go[data-anim=scurry]{animation:scurry 1.6s ease-in-out}
@keyframes scurry{0%,100%{transform:none}30%{transform:translateX(46px)}35%{transform:translateX(46px) scaleX(-1)}65%{transform:translateX(-10px) scaleX(-1)}70%{transform:translateX(-10px)}}
.wheel{transform-box:fill-box;transform-origin:50% 50%}
.go .wheel{animation:spin .6s linear 3}
@keyframes spin{to{transform:rotate(360deg)}}
.t[data-anim=fire],.t[data-anim=ambu],.t[data-anim=drive],.t[data-anim=roll],.t[data-anim=bike]{transform-origin:50% 100%}
.go[data-anim=fire],.go[data-anim=ambu],.go[data-anim=drive]{animation:drive 1.8s ease-in-out}
@keyframes drive{0%,100%{transform:none}10%{transform:translateY(-4px)}20%{transform:translate(10px,0)}50%{transform:translate(40px,-3px)}60%{transform:translate(40px,0)}100%{transform:none}}
.go[data-anim=roll],.go[data-anim=bike]{animation:roll 1.8s ease-in-out}
@keyframes roll{0%,100%{transform:none}45%{transform:translateX(28px)}55%{transform:translateX(28px)}}
.ladder{transform-box:fill-box;transform-origin:0% 100%}
.go[data-anim=fire] .ladder{animation:ladder 1.8s ease-in-out}
@keyframes ladder{0%,100%{transform:none}30%,70%{transform:rotate(-24deg)}}
.go .siren{animation:blink .3s steps(1) 6}
.go .siren.s2{animation-delay:.15s}
@keyframes blink{50%{fill:#fff7c2}}
.t[data-anim=wheelie]{transform-origin:12% 100%}
.go[data-anim=wheelie]{animation:wheelie 1.6s ease-in-out}
@keyframes wheelie{0%,100%{transform:none}25%{transform:translateX(16px) rotate(-16deg)}60%{transform:translateX(34px) rotate(-12deg)}80%{transform:translateX(30px)}}
.arm{transform-box:fill-box;transform-origin:0% 83%}
.go[data-anim=digger] .arm{animation:dig2 1.8s ease-in-out}
@keyframes dig2{0%,100%{transform:none}30%{transform:rotate(16deg)}55%{transform:rotate(-8deg)}80%{transform:rotate(10deg)}}
.amb-zzz{animation:zzzFloat 3.2s ease-in-out infinite}
@keyframes zzzFloat{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(10px,-14px);opacity:.55}}
.go[data-anim=zzzBig]{animation:zzzBig 1.6s ease-in-out}
@keyframes zzzBig{0%,100%{transform:none}40%{transform:translate(18px,-30px) scale(1.4);opacity:1}}

.steamfx{opacity:0}
.go .steamfx{animation:steam 1.6s ease-out}
.go .steamfx.s1{animation-delay:.2s}.go .steamfx.s2{animation-delay:.4s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-40px)}}
.sandfx{opacity:0}
.go .sandfx{animation:sand .9s cubic-bezier(.2,.7,.5,1) var(--d) both}
@keyframes sand{0%{opacity:1;transform:translate(0,0)}60%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}

@media (prefers-reduced-motion: reduce){
  .scene{transition:opacity .3s}
  .go,.glowfx.go{animation-duration:.8s!important;animation-name:soft!important}
  .amb-zzz{animation:none}
  @keyframes soft{50%{opacity:.6}}
}
</style>

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
let voices = [];
const loadVoices = () => { voices = synth ? synth.getVoices() : []; };
if (synth){ loadVoices(); synth.addEventListener?.('voiceschanged', loadVoices); }
const MALE = /Harri|Onni|Mikko|Male|Mies/i;
const FEMALE_ZH = /Tingting|Ting-Ting|Xiaoxiao|Xiaoyi|Huihui|Yaoyao|Meijia|Lili|Shanshan|Female|女/i;
function pickVoice(l){
  const pre = l === 'zh' ? 'zh' : 'fi';
  const c = voices.filter(v => v.lang.replace('_','-').toLowerCase().startsWith(pre));
  if (l === 'zh'){
    const cn = c.filter(v => /CN|cmn|Hans/i.test(v.lang) || /普通话|Mandarin/i.test(v.name));
    return cn.find(v => FEMALE_ZH.test(v.name)) || c.find(v => FEMALE_ZH.test(v.name)) || cn[0] || c[0] || null;
  }
  return c.find(v => MALE.test(v.name)) || c[0] || null;
}
const warned = {};
let speakingEl = null, curAudio = null, ttsTimer = null;
function stopVoice(){
  if (typeof webSrc !== 'undefined' && webSrc){ try { webSrc.onended = null; webSrc.stop(); } catch (e) {} webSrc = null; }
  if (curAudio){ curAudio.onended = curAudio.onerror = null; curAudio.pause(); curAudio = null; }
  clearTimeout(ttsTimer);
  if (synth && (synth.speaking || synth.pending)) synth.cancel();
  if (speakingEl){ speakingEl.classList.remove('speaking'); speakingEl = null; }
}
function markSpeaking(el){ if (el){ speakingEl = el; el.classList.add('speaking'); } }
function doneSpeaking(el){ if (el) el.classList.remove('speaking'); if (speakingEl === el) speakingEl = null; }
/* clip playback: <audio> from a blob URL first, then Web Audio, then device speech */
const clipBytes = {}, clipBlob = {}, clipBuf = {};
let webSrc = null;
function bytesOf(text, uri){
  if (!clipBytes[text]){ const b = atob(uri.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); clipBytes[text] = u; }
  return clipBytes[text];
}
function blobUrl(text, uri){
  if (!clipBlob[text]){ try { clipBlob[text] = URL.createObjectURL(new Blob([bytesOf(text, uri)], { type: 'audio/mpeg' })); } catch (e) { clipBlob[text] = uri; } }
  return clipBlob[text];
}
async function playWeb(text, uri, el){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') await ac.resume();
  if (!clipBuf[text]){
    const src = bytesOf(text, uri);
    clipBuf[text] = await new Promise((res, rej) => { const p = ac.decodeAudioData(src.buffer.slice(src.byteOffset, src.byteOffset + src.byteLength), res, rej); if (p && p.then) p.then(res, rej); });
  }
  const n = ac.createBufferSource(); n.buffer = clipBuf[text]; n.connect(ac.destination);
  webSrc = n; markSpeaking(el);
  n.onended = () => { doneSpeaking(el); if (webSrc === n) webSrc = null; };
  n.start();
}
function speak(text, el){
  stopVoice();
  if (webSrc){ try { webSrc.onended = null; webSrc.stop(); } catch (e) {} webSrc = null; }
  const clip = AUDIO[lang] && AUDIO[lang][text];
  if (clip){
    let fellBack = false;
    const fallback = () => {
      if (fellBack) return; fellBack = true;
      doneSpeaking(el); if (curAudio === a) curAudio = null;
      playWeb(text, clip, el).catch(() => tts(text, el));
    };
    const a = new Audio(); curAudio = a; markSpeaking(el);
    a.onended = () => { doneSpeaking(el); if (curAudio === a) curAudio = null; };
    a.onerror = fallback;
    a.src = blobUrl(text, clip);
    const p = a.play(); if (p && p.catch) p.catch(fallback);
    return;
  }
  tts(text, el);
}
function tts(text, el){
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  u.lang = lang === 'zh' ? 'zh-CN' : 'fi-FI';
  if (v) u.voice = v;
  else if (voices.length && !warned[lang]) { warned[lang] = 1; toast(UI[lang].noVoice); }
  if (lang === 'zh'){ u.pitch = 1.2; u.rate = 0.82; }
  else { u.pitch = v && MALE.test(v.name) ? 0.95 : 0.62; u.rate = 0.82; }
  markSpeaking(el);
  u.onend = u.onerror = () => doneSpeaking(el);

  ttsTimer = setTimeout(() => synth.speak(u), 60);
}
let tt;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 4200); }

/* ---------- little pop sound ---------- */
let ac;
function bloop(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(lang === 'zh' ? 660 : 440, t);
    o.frequency.exponentialRampToValueAtTime(lang === 'zh' ? 1100 : 760, t + .12);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .2);
  }catch(e){}
}


/* ---------- sparkles ---------- */
const fx = document.getElementById('fx');
const SPARK = ['#ffd84d','#ef6950','#6f60bd','#5cc9a0','#9be4f4','#fff'];
function sparkle(cx, cy){
  for (let i = 0; i < 9; i++){
    const s = document.createElement('i');
    s.className = 'spark' + (i % 3 === 0 ? ' star' : '');
    const a = (i / 9) * Math.PI * 2 + Math.random() * .5, d = 40 + Math.random() * 36;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${SPARK[i % SPARK.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;
    fx.appendChild(s); setTimeout(() => s.remove(), 750);
  }
}

/* ---------- responsive framing: fit each scene's content box into the view ---------- */
function fit(){
  const vw = innerWidth, vh = innerHeight;
  const phonePortrait = vw < 600 && vh > vw;
  if (app.classList.contains('portrait') !== phonePortrait){ app.classList.toggle('portrait', phonePortrait); }
  const W = view.clientWidth, H = view.clientHeight;
  const portrait = H > W * 1.1;
  DATA.forEach((sc, i) => {
    const el = sceneEls[i], layer = el.querySelector('.layer');
    let [x0, y0, x1, y1] = phonePortrait ? sc.artBox : sc.bbox;
    const pad = 18; x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const bw = x1 - x0, bh = y1 - y0;
    let s = Math.min(W / bw, H / bh);
    s = Math.min(s, 1.7);
    const cx = (x0 + x1) / 2;
    // sit content a little low in tall views so the ground fills the bottom, not empty sky
    const cy = (y0 + y1) / 2;
    let tx = W / 2 - s * cx, ty = H / 2 - s * cy;
    if (portrait) ty = Math.min(H - s * y1 - 8, ty + (H - s * bh) * 0.18);
    layer.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    // labels: never smaller than ~0.68 of design size on screen, never huge
    const minE = vh <= 500 ? 0.6 : (vw >= 700 ? 0.92 : 0.68);
    const e = Math.max(minE, Math.min(s, 1.25));
    // largest chip scale that keeps chips from covering each other
    const chips = [...layer.querySelectorAll('.word')].map(b => ({ x: parseFloat(b.style.left), y: parseFloat(b.style.top), w: b.offsetWidth || 113, h: 55 }));
    let kmax = Infinity;
    for (let a = 0; a < chips.length; a++) for (let c = a + 1; c < chips.length; c++){
      const A = chips[a], B = chips[c];
      const kx = 2 * Math.abs(A.x - B.x) / (A.w + B.w), ky = 2 * Math.abs(A.y - B.y) / (A.h + B.h);
      kmax = Math.min(kmax, Math.max(kx, ky) * 0.96);
    }
    let ls = Math.max(Math.min(1, e / s), Math.min(e / s, kmax));
    if (kmax < ls) ls = Math.max(kmax, 0.72);
    layer.style.setProperty('--ls', ls.toFixed(3));
    el.querySelector('.ground').style.top = (ty + s * sc.ground.y) + 'px';
    el.querySelector('.ground').style.background = sc.ground.color;
  });
}
new ResizeObserver(fit).observe(view);
addEventListener('resize', fit);

function word(zh){ return lang === 'zh' ? zh : (WORDS[zh] || zh); }

function render(){
  const sc = DATA[cur], t = sc[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'fi';
  app.style.setProperty('--accent', sc.accent);
  app.style.setProperty('--accent-deep', sc.accentDeep);
  app.style.setProperty('--title', sc.title);
  app.style.setProperty('--sel', sc.selBorder || sc.accent);
  app.style.setProperty('--sky', sc.sky);
  app.style.setProperty('--ground-c', sc.ground.color);
  app.style.setProperty('--av1', sc.av1); app.style.setProperty('--av2', sc.av2);
  if (sc.hdrAccent) app.style.setProperty('--hdr-accent', sc.hdrAccent); else app.style.removeProperty('--hdr-accent');
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', sc.sky);
  document.getElementById('dayTitle').textContent = UI[lang].day;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('hintTxt').textContent = UI[lang].hint;
  document.getElementById('today').textContent = UI[lang].today;
  document.getElementById('capTxt').textContent = t.cap;
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('total').textContent = DATA.length;
  const shelf = document.getElementById('shelf');
  if (shelf.dataset.scene !== String(cur)){
    shelf.dataset.scene = cur;
    shelf.innerHTML = '';
    [...sc.labels].sort((a, b) => a.y - b.y || a.x - b.x).forEach(l => {
      const b = document.createElement('button');
      b.className = 'word'; b.dataset.word = l.zh;
      b.innerHTML = `<span class="w"></span><span class="dot"><svg viewBox="0 0 24 24" aria-hidden="true">${SPK}</svg></span>`;
      shelf.appendChild(b);
    });
  }
  document.querySelectorAll('.word').forEach(b => b.querySelector('.w').textContent = word(b.dataset.word));
  document.querySelectorAll('.lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  [...dots.children].forEach((d, i) => d.setAttribute('aria-current', i === cur));
  sceneEls.forEach((el, i) => el.dataset.pos = i < cur ? 'prev' : i > cur ? 'next' : 'cur');
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === DATA.length - 1;
}

/* ---------- play ---------- */
function restart(el){ el.classList.remove('go'); void el.getBoundingClientRect(); el.classList.add('go'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('go'), 2600); }
function playKey(key){
  const el = sceneEls[cur];
  el.querySelectorAll(`.t[data-keys~="${key}"]`).forEach(t => {
    restart(t);
    const g = t.previousElementSibling;
    if (g && g.classList.contains('glowfx')) restart(g);
  });
  [...el.querySelectorAll('.word'), ...document.querySelectorAll('#shelf .word')].forEach(b => { if (b.dataset.word === key){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } });
}
function sayKey(key){
  playKey(key);
  const pool = app.classList.contains('portrait') ? document.querySelectorAll('#shelf .word') : sceneEls[cur].querySelectorAll('.word');
  const lbl = [...pool].find(b => b.dataset.word === key);
  speak(word(key), lbl);
}
function sayCaption(){
  DATA[cur].caption.forEach(playKey);
  speak(DATA[cur][lang].cap, document.getElementById('capSpeak'));
}
function go(i){
  if (i < 0 || i >= DATA.length || i === cur) return;
  cur = i; render();
  setTimeout(() => speak(DATA[cur][lang].cap, document.getElementById('capSpeak')), 450);
}

document.addEventListener('pointerdown', e => { sparkle(e.clientX, e.clientY); bloop(); });
scenesEl.addEventListener('click', e => {
  const w = e.target.closest('.word');
  if (w) return sayKey(w.dataset.word);
  const t = e.target.closest('[data-key]');
  if (t) sayKey(t.dataset.key);
});
document.querySelectorAll('.lang').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; render(); fit();
  b.classList.remove('hello'); void b.offsetWidth; b.classList.add('hello');
  speak(UI[lang].hello);
}));
document.getElementById('hint').onclick = () => speak(UI[lang].hint);
document.getElementById('capSpeak').onclick = sayCaption;
document.getElementById('capBody').onclick = sayCaption;
document.getElementById('capNext').onclick = () => go(cur + 1);
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
// swipe between scenes
let sx = null, sy = null;
view.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
view.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1)); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('shelf').addEventListener('click', e => { const w = e.target.closest('.word'); if (w) sayKey(w.dataset.word); });
render(); fit();
requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('boot')));
</script>
